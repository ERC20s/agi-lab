name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Evals are standard-library only (CONTRIBUTING.md): there is nothing to pip install.
      - name: Run evals (declared check)
        run: python evals/run_all.py --json-output evals/last_run.json
